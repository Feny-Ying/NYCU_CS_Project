# --- IPPO specific parameters ---

action_selector: "soft_policies"
mask_before_softmax: True

runner: "parallel"

buffer_size: 10
batch_size_run: 10
batch_size: 10

# update the target network every {} training steps
target_update_interval_or_tau: 200


lr: 0.0003

obs_agent_id: True
obs_last_action: False
obs_individual_obs: False

# use IA2C
agent_output_type: "pi_logits"
learner: "ppo_learner"
entropy_coef: 0.001
standardise_returns: False
standardise_rewards: False
use_rnn: True
q_nstep: 5 # 1 corresponds to normal r + gammaV
critic_type: "ac_critic"
epochs: 4
eps_clip: 0.2
name: "ippo"

t_max: 100050000

dormant_check_interval: 0
policy_diff_interval_1: 0 # Compare the policy every {} gradient steps (if 0, not using policy diff)
policy_diff_interval_2: 0 # Compare the policy every {} gradient steps (if 0, not using policy diff)
policy_diff_interval_3: 0 # Compare the policy every {} gradient steps (if 0, not using policy diff)
