# --- IQL specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 200000
evaluation_epsilon: 0.05
runner: "episode"

buffer_size: 5000

# update the target network every {} episodes
target_update_interval_or_tau: 200

obs_agent_id: True
obs_last_action: False
obs_individual_obs: False

# use the Q_Learner to train

agent_output_type: "q"
learner: "q_learner"
standardise_returns: False
standardise_rewards: True
double_q: True
use_rnn: True
mixer: "vdn"

name: "vdn_reset@1,2,3,4,5,6"

lr: 0.0003
hidden_dim: 128


reset_after_switch_visibility: "lbf:15s->1s@0,2s@1e6,3s@2e6,4s@3e6,5s@4e6,6s@5e6,15s@6e6"