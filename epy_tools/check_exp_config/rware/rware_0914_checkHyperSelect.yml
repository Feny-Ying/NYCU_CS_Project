# --------------- Plotting Settings ---------------
# 畫之前請先跑 `check_exp.py` 確認沒有錯誤再執行 `plot_exp.py`
plot:
  templates:
    - template_name: 'RWARE_plot_template - base'
      exp_vars:
        alg: [ 'mappo' ]
        map: [ tiny-2ag-3s ]
        sight:
          - "ucb(1,2,3)_c1_w5000_div30"
          - "ucb(1,2,3)_c1_w10000_div30"
          - "ucb(1,2,3)_c1_w20000_div30"
          - "ucb(1,2,3)_c1.5_w5000_div30"
          - "ucb(1,2,3)_c1.5_w10000_div30"
          - "ucb(1,2,3)_c1.5_w20000_div30"
          - "ucb(1,2,3)_c1_w5000"
          - "ucb(1,2,3)_c1_w10000"
          - "ucb(1,2,3)_c1_w20000"
          - "ucb(1,2,3)_c1.5_w5000"
          - "ucb(1,2,3)_c1.5_w10000"
          - "ucb(1,2,3)_c1.5_w20000"
        sight_id: [ noCurSightId, curSightId ]
      plot_config:
        title: 'SMAC - Whether to add current sight info?'
        save_path: 'rware/0914_hyperSelect/'
        tag: 'test_return_mean'
        band: 'std' # 'ci' or 'stderr' or 'minmax'
        plot_skip: 1
        y_low: -0.02
        y_high: 30.02
        ylabel: 'Test Return'
        base_width: 12
        base_height: 18
        no_show: True
        # 標註有哪些 pure sight (也可以不含)。這是用來輔助pure sight 深淺顏色的設定
        pure_sights: [ 1s, 2s, 3s, 4s, 5s ]
        #
        label_without_overall_performance: False
        label_without_len_and_runs: False
        hide_subtitle_description: False
        show_title: False
        show_legend: True
        show_text_on_line: False
        custom_ax_row_var: alg
        custom_ax_col_var: sight_id
        row_var_order: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
        col_var_order: [ noCurSightId, curSightId ]
        list_of_assigned_styles_and_keywords:
          # Var "c":
          - { keywords: [ 'c1_' ], color: red }
          - { keywords: [ 'c1.5' ], color: green }
          - { keywords: [ 'c1_', 'div' ], color: orange }
          - { keywords: [ 'c1.5', 'div' ], color: blue }
          # Var "w":
          - { keywords: [ 'w5000' ], marker: 'o' }
          - { keywords: [ 'w10000' ], marker: 's' }
          - { keywords: [ 'w20000' ], marker: '^' }
        legend_loc: 'lower right'
    - template_name: 'RWARE_plot_template - hyper'
      exp_vars:
        alg: [ 'mappo' ]
        map: [ tiny-2ag-3s ]
        sight:
          - "ucb(1,2,3)_c1_w5000_div30"
          - "ucb(1,2,3)_c1_w10000_div30"
          - "ucb(1,2,3)_c1_w20000_div30"
          - "ucb(1,2,3)_c1.5_w5000_div30"
          - "ucb(1,2,3)_c1.5_w10000_div30"
          - "ucb(1,2,3)_c1.5_w20000_div30"
          - "ucb(1,2,3)_c1_w5000"
          - "ucb(1,2,3)_c1_w10000"
          - "ucb(1,2,3)_c1_w20000"
          - "ucb(1,2,3)_c1.5_w5000"
          - "ucb(1,2,3)_c1.5_w10000"
          - "ucb(1,2,3)_c1.5_w20000"
        sight_id: [ noCurSightId, curSightId ]
      plot_config:
        title: 'SMAC - Whether to add current sight info?'
        save_path: 'rware/0914_hyperSelect/'
        tag: 'test_return_mean'
        band: 'std' # 'ci' or 'stderr' or 'minmax'
        plot_skip: 1
        y_low: -0.02
        y_high: 30.02
        base_width: 10
        base_height: 8
        x_high: 60100000
        x_low: -100000
        ylabel: 'Test Return'
        no_show: True
        # 標註有哪些 pure sight (也可以不含)。這是用來輔助pure sight 深淺顏色的設定
        pure_sights: [ 1s, 2s, 3s, 4s, 5s ]
        #
        label_without_overall_performance: False
        label_without_len_and_runs: False
        hide_subtitle_description: False
        show_title: False
        show_legend: True
        show_text_on_line: False
        custom_ax_row_var: alg
        custom_ax_col_var: sight_id
        row_var_order: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
        col_var_order: [ noCurSightId, curSightId ]
        list_of_assigned_styles_and_keywords:
          # Var "c":
          - { keywords: [ 'c1_' ], color: red }
          - { keywords: [ 'c1.5' ], color: green }
          - { keywords: [ 'c1_', 'div' ], color: orange }
          - { keywords: [ 'c1.5', 'div' ], color: blue }
          # Var "w":
          - { keywords: [ 'w5000' ], marker: 'o' }
          - { keywords: [ 'w10000' ], marker: 's' }
          - { keywords: [ 'w20000' ], marker: '^' }
        legend_loc: 'lower right'

