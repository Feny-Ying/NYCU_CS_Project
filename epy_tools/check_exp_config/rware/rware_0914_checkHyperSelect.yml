parent: epy_tools/check_exp_config/shared/rware.yml

hp_other_variables:
  sight_id:
    noCurSightId:
      env_args:
        add_sight_id_len: [ null ]
    curSightId:
      env_args:
        add_sight_id_len: [ 3,  5 ]

hp_map_sight:
  tiny-2ag-3s:
    "ucb(1,2,3)_c1_w5000_div30":
      env_args: { key: [ robotic_warehouse:rware-tiny-2ag-3s-v1 ] }
      preprocess_desc: [ "rware:3s->ucb(1s,2s,3s),c=1,w=5000,div=30" ]
