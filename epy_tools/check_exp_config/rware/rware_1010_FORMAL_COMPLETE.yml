# Cmd: python epy_tools/check_and_plot.py  -c epy_tools/check_exp_config/rware/rware_1009_FORMAL_COMPLETE.yml  -f projects/RWARE/1009_FORMAL_COMPLETE/sacred
domain: RWARE
parent: null
seeds: [ 0, 1, 2, 3, 4 ]


hp_all_skip: # 所有 alg 都跳過檢查的超參數。為 list of str。
  - t_max
  - save_path
  - buffer_cpu_only
  - seed # 這裡不用設，因為別處有特別檢查 seed
  - local_results_path
  - name
  - reset_pos
  - save_model
  - save_replay
  - use_cuda
  - use_tensorboard
  - render
  - force_render
  # 其它新的feature，不用管, 在RWARE也沒用到
  - fas_dynamic
  - use_fas
  - fas_lambda

hp_all:
  add_value_last_step: [ True ]
  agent: [ "rnn" ]
  batch_size: [ 32 ]
  reset_buffer_after_switch_visibility: [ False ]
  force_render: [ False ]
  checkpoint_path: [ "" ] # Train from scratch
  env_args:
    add_sight_id_len: [ null ]
    key: [ ]
    pretrained_wrapper: [ null ]
    time_limit: [ 500 ]
  evaluate: [ False ]
  gamma: [ 0.99 ]
  grad_norm_clip: [ 10.0 ]
  env: [ 'gymma' ]
  hypergroup: [ null ]
  label: [ 'default_label' ]
  runner_log_interval: [ 10000 ]
  learner_log_interval: [ 10000 ]
  load_step: [ 0 ]
  log_interval: [ 50000 ]
  mac: [ 'basic_mac' ]
  n_distillation_grad_steps: [ 0 ]
  n_grad_steps: [ 1 ]
  n_offline_grad_steps: [ 0 ]
  optim_alpha: [ 0.99 ]
  optim_eps: [ !!float 1e-05 ]
  preprocess_desc: [ null ]
  redo_freq: [ 0 ]
  redo_tau: [ 0 ]
  repeat_id: [ 1 ]
  reset_freq: [ 0 ]
  test_greedy: [ True ]
  test_nepisode: [ 100 ]
  train_next_visibility: [ False ]
  turn_off_train_preprocess: [ False ]
  weight_decay: [ 0.0 ]
  reset_after_switch_visibility: [ False ]
  dormant_all_taus: [ [ 0, 0.0001, 0.001, 0.01 ] ]
  policy_diff_n_batches: [ 32 ]
  dormant_check_interval: [ 0 ]
  dormant_n_batches: [ 32 ]
  policy_diff_interval_1: [ 0 ]
  policy_diff_interval_2: [ 0 ]
  policy_diff_interval_3: [ 0 ]
  offline_buffer_path: [ null ]
  offline_buffer_grad_steps: [ 100 ]
  test_interval: [ 500000 ]
  save_model_interval: [ 500000 ]

hp_alg_group:
  value-based:
    action_selector: [ "epsilon_greedy" ]
    epsilon_start: [ 1.0 ]
    epsilon_finish: [ 0.05 ]
    epsilon_anneal_time: [ 1000000 ]
    evaluation_epsilon: [ 0.05 ]
    runner: [ "episode" ]
    buffer_size: [ 500 ]
    target_update_interval_or_tau: [ 200 ]
    obs_agent_id: [ True ]
    obs_last_action: [ False ]
    obs_individual_obs: [ False ]
    agent_output_type: [ "q" ]
    learner: [ "q_learner" ]
    standardise_returns: [ False ]
    standardise_rewards: [ True ]
    double_q: [ True ]
    use_rnn: [ True ]
    lr: [ 0.0005 ]
    hidden_dim: [ 128 ]
    batch_size_run: [ 1 ]
  ppo:
    hidden_dim: [ 64 ]
    action_selector: [ "soft_policies" ]
    mask_before_softmax: [ True ]
    runner: [ "parallel" ]
    buffer_size: [ 10 ]
    batch_size_run: [ 10 ]
    batch_size: [ 10 ]
    lr: [ 0.0005 ]
    obs_agent_id: [ True ]
    obs_last_action: [ False ]
    obs_individual_obs: [ False ]
    agent_output_type: [ "pi_logits" ]
    learner: [ "ppo_learner" ]
    entropy_coef: [ 0.001 ]
    use_rnn: [ True ]
    standardise_returns: [ False ]
    standardise_rewards: [ False ]
    q_nstep: [ 10 ]
    epochs: [ 4 ]
    eps_clip: [ 0.2 ]
    target_update_interval_or_tau: [ 0.01 ]

hp_alg:
  iql:
    min_n_tests: 61 # 30M
    hyperparameter_group: value-based
    custom_hyperparameters: { mixer: [ null ] }
    not_having_ok_hyperparameters:
      - force_render
      - train_next_visibility # 預設是不使用，所以沒有specify也不影響
      - reset_buffer_after_switch_visibility # 預設是不使用，所以沒有specify也不影響
      - offline_buffer_path
      - offline_buffer_grad_steps
  vdn:
    min_n_tests: 61
    hyperparameter_group: value-based
    custom_hyperparameters: { mixer: [ vdn ] }
    not_having_ok_hyperparameters:
      - force_render
      - train_next_visibility # 預設是不使用，所以沒有specify也不影響
      - reset_buffer_after_switch_visibility # 預設是不使用，所以沒有specify也不影響
      - offline_buffer_path
      - offline_buffer_grad_steps
  qmix:
    min_n_tests: 61
    hyperparameter_group: value-based
    custom_hyperparameters: { mixer: [ qmix ], mixing_embed_dim: [ 32 ], hypernet_layers: [ 2 ],hypernet_embed: [ 64 ] }
    not_having_ok_hyperparameters:
      - force_render
      - train_next_visibility # 預設是不使用，所以沒有specify也不影響
      - reset_buffer_after_switch_visibility # 預設是不使用，所以沒有specify也不影響
      - offline_buffer_path
      - offline_buffer_grad_steps
  ippo:
    min_n_tests: 61
    hyperparameter_group: ppo
    custom_hyperparameters: { critic_type: [ "ac_critic" ] }
    not_having_ok_hyperparameters:
      - offline_buffer_path
      - offline_buffer_grad_steps
  mappo:
    min_n_tests: 61
    hyperparameter_group: ppo
    custom_hyperparameters: { critic_type: [ "cv_critic" ] }
    not_having_ok_hyperparameters:
      - offline_buffer_path
      - offline_buffer_grad_steps

hp_map:

hp_sight:

hp_map_sight:

  tiny-2ag-5s:
    5s: { env_args: { key: [ robotic_warehouse:rware-tiny-2ag-5s-v1 ] } , preprocess_desc: [ null ] }
    4s: { env_args: { key: [ robotic_warehouse:rware-tiny-2ag-4s-v1 ] } , preprocess_desc: [ null ] }
    3s: { env_args: { key: [ robotic_warehouse:rware-tiny-2ag-3s-v1 ] } , preprocess_desc: [ null ] }
    2s: { env_args: { key: [ robotic_warehouse:rware-tiny-2ag-2s-v1 ] } , preprocess_desc: [ null ] }
    1s: { env_args: { key: [ robotic_warehouse:rware-tiny-2ag-1s-v1 ] } , preprocess_desc: [ null ] }
    "ucb(1,2,3,4,5)_c1_w10000": { env_args: { key: [ robotic_warehouse:rware-tiny-2ag-5s-v1 ] } ,
                                  preprocess_desc: [ "rware:5s->ucb(1s,2s,3s,4s,5s),c=1,w=10000" ] }
    "ucb(1,2,3,4,5)_c2_w5000": { env_args: { key: [ robotic_warehouse:rware-tiny-2ag-5s-v1 ] },
                                 preprocess_desc: [ "rware:5s->ucb(1s,2s,3s,4s,5s),c=2,w=5000" ] }

  tiny-2ag-3s:
    3s: { env_args: { key: [ robotic_warehouse:rware-tiny-2ag-3s-v1 ] } , preprocess_desc: [ null ] }
    2s: { env_args: { key: [ robotic_warehouse:rware-tiny-2ag-2s-v1 ] } , preprocess_desc: [ null ] }
    1s: { env_args: { key: [ robotic_warehouse:rware-tiny-2ag-1s-v1 ] } , preprocess_desc: [ null ] }
    "ucb(1,2,3)_c1_w10000": { env_args: { key: [ robotic_warehouse:rware-tiny-2ag-3s-v1 ] } ,
                              preprocess_desc: [ "rware:3s->ucb(1s,2s,3s),c=1,w=10000" ] }
    "ucb(1,2,3)_c2_w5000": { env_args: { key: [ robotic_warehouse:rware-tiny-2ag-3s-v1 ] } ,
                             preprocess_desc: [ "rware:3s->ucb(1s,2s,3s),c=2,w=5000" ] }

  small-2ag-5s:
    5s: { env_args: { key: [ robotic_warehouse:rware-small-2ag-5s-v1 ] } , preprocess_desc: [ null ] }
    4s: { env_args: { key: [ robotic_warehouse:rware-small-2ag-4s-v1 ] } , preprocess_desc: [ null ] }
    3s: { env_args: { key: [ robotic_warehouse:rware-small-2ag-3s-v1 ] } , preprocess_desc: [ null ] }
    2s: { env_args: { key: [ robotic_warehouse:rware-small-2ag-2s-v1 ] } , preprocess_desc: [ null ] }
    1s: { env_args: { key: [ robotic_warehouse:rware-small-2ag-1s-v1 ] } , preprocess_desc: [ null ] }
    "ucb(1,2,3,4,5)_c1_w10000": { env_args: { key: [ robotic_warehouse:rware-small-2ag-5s-v1 ] } ,
                                  preprocess_desc: "rware:5s->ucb(1s,2s,3s,4s,5s),c=1,w=10000" }
    "ucb(1,2,3,4,5)_c2_w5000": { env_args: { key: [ robotic_warehouse:rware-small-2ag-5s-v1 ] } ,
                                 preprocess_desc: "rware:5s->ucb(1s,2s,3s,4s,5s),c=2,w=5000" }
  small-2ag-3s:
    3s: { env_args: { key: [ robotic_warehouse:rware-small-2ag-3s-v1 ] } , preprocess_desc: [ null ] }
    2s: { env_args: { key: [ robotic_warehouse:rware-small-2ag-2s-v1 ] } , preprocess_desc: [ null ] }
    1s: { env_args: { key: [ robotic_warehouse:rware-small-2ag-1s-v1 ] } , preprocess_desc: [ null ] }
    "ucb(1,2,3)_c1_w10000": { env_args: { key: [ robotic_warehouse:rware-small-2ag-3s-v1 ] } ,
                              preprocess_desc: "rware:3s->ucb(1s,2s,3s),c=1,w=10000" }
    "ucb(1,2,3)_c2_w5000": { env_args: { key: [ robotic_warehouse:rware-small-2ag-3s-v1 ] } ,
                             preprocess_desc: "rware:3s->ucb(1s,2s,3s),c=2,w=5000" }

hp_other_variables: { }



# --------------- Plotting Settings ---------------
# 畫之前請先跑 `check_exp.py` 確認沒有錯誤再執行 `plot_exp.py`
plot:
  templates:
    - template_name: 'RWARE_plot_template - base'
      exp_vars:
        alg: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
        map: [ tiny-2ag-5s, tiny-2ag-3s, small-2ag-5s, small-2ag-3s ]
        #        sight: [ 'ucb(1,2,3)_c1_w10000', 'ucb(1,2,3)_c2_w5000', 'ucb(1,2,3,4,5)_c1_w10000', 'ucb(1,2,3,4,5)_c2_w5000', 1s, 2s, 3s, 4s, 5s ]
        sight: [ 'ucb(1,2,3)_c2_w5000',  'ucb(1,2,3,4,5)_c2_w5000', 1s, 2s, 3s, 4s, 5s ]
      skip_var_combinations:
        - alg: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
          map: [ tiny-2ag-5s, small-2ag-5s ]
          sight: [ 'ucb(1,2,3)_c1_w10000', 'ucb(1,2,3)_c2_w5000' ]
        - alg: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
          map: [ tiny-2ag-3s, small-2ag-3s ]
          sight: [ 'ucb(1,2,3,4,5)_c1_w10000', 'ucb(1,2,3,4,5)_c2_w5000',  4s, 5s ]
      plot_config:
        title: 'SMAC - Whether to add current sight info?'
        save_path: 'rware/1009_RWARE_FORMAL_COMPLETE/'
        tag: 'test_return_mean'
        band: 'std' # 'ci' or 'stderr' or 'minmax'
        plot_skip: 1
        #        y_low: -0.02
        #        y_high: 30.02
        ylabel: 'Test Return'
        base_width: 6
        base_height: 6
        no_show: True
        # 標註有哪些 pure sight (也可以不含)。這是用來輔助pure sight 深淺顏色的設定
        pure_sights: [ 1s, 2s, 3s, 4s, 5s ]
        #
        label_without_overall_performance: True
        label_without_len_and_runs: True
        hide_subtitle_description: True
        show_title: False
        show_legend: True
        show_text_on_line: False
        custom_ax_row_var: alg
        custom_ax_col_var: map
        row_var_order: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
        col_var_order: [ tiny-2ag-easy-5s, tiny-2ag-easy-3s, tiny-2ag-5s, tiny-2ag-3s, small-2ag-5s, small-2ag-3s ]
        map_keyword_to_low_or_high:
          'tiny-2ag-5s': { y_low: -0.02, y_high: 22.02 }
          'tiny-2ag-3s': { y_low: -0.02, y_high: 25.02 }
          'small-2ag-5s': { y_low: -0.02, y_high: 2.52 }
          'small-2ag-3s': { y_low: -0.02, y_high: 3.02 }
        list_of_assigned_styles_and_keywords:
          - { keywords: [ 'ucb' ], color: green }
          - { keywords: [ '_c2_w5000' ], color: red }
        no_show_row_names: True
        show_subtitle: False
  plots:

#    # ======================================================= For Main Paper =======================================================

    #　===================== All Pure and UCB =====================
    - template_name: 'RWARE_plot_template - base'
      exp_vars:
        alg: [ 'qmix' ]
        map: [ tiny-2ag-3s ]
        sight: [ 1s, 2s, 3s, 'ucb(1,2,3)_c2_w5000' ]
      plot_config:
        title: '(main) RWARE - All Pure vs UCB'
        no_show_col_names: True
        map_keyword_to_low_or_high:
          'tiny-2ag-3s': { y_low: -0.02, y_high: 15.02 }
        change_pure_sight_name_to_no_dsr: True
        change_ucb_name_to_dsr: True

    #　===================== Testing Selected Sight =====================
    - template_name: 'RWARE_plot_template - base'
      exp_vars:
        alg: [ 'qmix' ]
        map: [ tiny-2ag-3s ]
        sight: [ 'ucb(1,2,3)_c2_w5000' ]
      skip_var_combinations:
        - alg: [ 'qmix' ]
          map: [ tiny-1ag-5s,  tiny-2ag-easy-5s, tiny-2ag-5s, small-2ag-5s ]
          sight: [ 'ucb(1,2,3)_c1_w10000', 'ucb(1,2,3)_c2_w5000' ]
        - alg: [ 'qmix' ]
          map: [ tiny-1ag-3s,  tiny-2ag-easy-3s, tiny-2ag-3s, small-2ag-3s ]
          sight: [ 'ucb(1,2,3,4,5)_c1_w10000', 'ucb(1,2,3,4,5)_c2_w5000', 4s, 5s, 1s, 2s ]
      plot_config:
        title: '(main) RWARE - Test Selected Sights'
        map_keyword_to_low_or_high:
          'tiny-2ag-3s': { y_low: 0.48, y_high: 3.42 }
        tag: 'test_selected_sight_mean'
        ylabel: 'Test Selected Sight'
        no_show_col_names: True
        change_pure_sight_name_to_no_dsr: True
        change_ucb_name_to_dsr: True


    # ======================================================= All QMIX =======================================================

    #　===================== Original vs DSR (only 2 maps) =====================
    - template_name: 'RWARE_plot_template - base'
      exp_vars:
        alg: [ 'qmix' ]
        map: [ tiny-2ag-5s, tiny-2ag-3s, small-2ag-5s, small-2ag-3s ]
        sight: [ 1s, 2s, 3s, 4s, 5s, "ucb(1,2,3,4,5)_c2_w5000", "ucb(1,2,3)_c2_w5000" ]
      skip_var_combinations:
        - alg: [ 'qmix' ]
          map: [ tiny-1ag-5s,  tiny-2ag-easy-5s, tiny-2ag-5s, small-2ag-5s ]
          sight: [ 'ucb(1,2,3)_c1_w10000', 'ucb(1,2,3)_c2_w5000', 1s, 2s, 3s, 4s ]
        - alg: [ 'qmix' ]
          map: [ tiny-1ag-3s,  tiny-2ag-easy-3s, tiny-2ag-3s, small-2ag-3s ]
          sight: [ 'ucb(1,2,3,4,5)_c1_w10000', 'ucb(1,2,3,4,5)_c2_w5000', 4s, 5s, 1s, 2s ]
      plot_config:
        title: '(All QMIX) RWARE - Original vs UCB'
        list_of_assigned_styles_and_keywords:
          - { keywords: [ 's' ], color: black }
          - { keywords: [ 'ucb' ], color: red }
        y_low: null
        y_high: null
        change_pure_sight_name_to_no_dsr: True
        change_ucb_name_to_dsr: True
        change_ucb_name_to_original: True
        map_keyword_to_low_or_high:
          'tiny-2ag-5s': { y_low: -0.02, y_high: 12.52 }
          'tiny-2ag-3s': { y_low: -0.02, y_high: 12.52 }
          'small-2ag-5s': { y_low: -0.02, y_high: 2.02 }
          'small-2ag-3s': { y_low: -0.02, y_high: 2.02 }

    #　===================== Original vs DSR (only 2 maps)  same y limit=====================
    - template_name: 'RWARE_plot_template - base'
      exp_vars:
        alg: [ 'qmix' ]
        map: [ tiny-2ag-5s, tiny-2ag-3s, small-2ag-5s, small-2ag-3s ]
        sight: [ 1s, 2s, 3s, 4s, 5s, "ucb(1,2,3,4,5)_c2_w5000", "ucb(1,2,3)_c2_w5000" ]
      skip_var_combinations:
        - alg: [ 'qmix' ]
          map: [ tiny-1ag-5s,  tiny-2ag-easy-5s, tiny-2ag-5s, small-2ag-5s ]
          sight: [ 'ucb(1,2,3)_c1_w10000', 'ucb(1,2,3)_c2_w5000', 1s, 2s, 3s, 4s ]
        - alg: [ 'qmix' ]
          map: [ tiny-1ag-3s,  tiny-2ag-easy-3s, tiny-2ag-3s, small-2ag-3s ]
          sight: [ 'ucb(1,2,3,4,5)_c1_w10000', 'ucb(1,2,3,4,5)_c2_w5000', 4s, 5s, 1s, 2s ]
      plot_config:
        title: '(All QMIX) RWARE - Original vs UCB - same y limit'
        list_of_assigned_styles_and_keywords:
          - { keywords: [ 's' ], color: black }
          - { keywords: [ 'ucb' ], color: red }
        y_low: null
        y_high: null
        change_pure_sight_name_to_no_dsr: True
        change_ucb_name_to_dsr: True
        change_ucb_name_to_original: True
        map_keyword_to_low_or_high:
          'tiny-2ag-5s': { y_low: -0.02, y_high: 12.52 }
          'tiny-2ag-3s': { y_low: -0.02, y_high: 12.52 }
          'small-2ag-5s': { y_low: -0.02, y_high: 12.52 }
          'small-2ag-3s': { y_low: -0.02, y_high: 12.52 }

    #　===================== All Pure and UCB (only 2 maps) =====================
    - template_name: 'RWARE_plot_template - base'
      exp_vars:
        alg: [ 'qmix' ]
        map: [ tiny-2ag-5s, tiny-2ag-3s, small-2ag-5s, small-2ag-3s ]
        sight: [ 1s, 2s, 3s, 4s, 5s, "ucb(1,2,3,4,5)_c2_w5000", "ucb(1,2,3)_c2_w5000" ]
      plot_config:
        title: '(All QMIX) RWARE - All Pure vs UCB'
        change_pure_sight_name_to_no_dsr: True
        change_ucb_name_to_dsr: True
        map_keyword_to_low_or_high:
          'tiny-2ag-5s': { y_low: -0.02, y_high: 12.52 }
          'tiny-2ag-3s': { y_low: -0.02, y_high: 12.52 }
          'small-2ag-5s': { y_low: -0.02, y_high: 2.02 }
          'small-2ag-3s': { y_low: -0.02, y_high: 2.02 }

    #　===================== Testing Selected Sight =====================
    - template_name: 'RWARE_plot_template - base'
      exp_vars:
        alg: [ 'qmix' ]
        map: [ tiny-2ag-5s, tiny-2ag-3s, small-2ag-5s, small-2ag-3s ]
        sight: [ "ucb(1,2,3)_c2_w5000" , "ucb(1,2,3,4,5)_c2_w5000" ]
      skip_var_combinations:
        - alg: [ 'qmix' ]
          map: [ tiny-1ag-5s,  tiny-2ag-easy-5s, tiny-2ag-5s, small-2ag-5s ]
          sight: [ 'ucb(1,2,3)_c1_w10000', 'ucb(1,2,3)_c2_w5000' ]
        - alg: [ 'qmix' ]
          map: [ tiny-1ag-3s,  tiny-2ag-easy-3s, tiny-2ag-3s, small-2ag-3s ]
          sight: [ 'ucb(1,2,3,4,5)_c1_w10000', 'ucb(1,2,3,4,5)_c2_w5000', 4s, 5s, 1s, 2s ]
      plot_config:
        title: '(All QMIX) RWARE - Test Selected Sights'
        map_keyword_to_low_or_high:
          'tiny-2ag-5s': { y_low: 0.48, y_high: 5.02 }
          'small-2ag-5s': { y_low: 0.48, y_high: 5.02 }
          'tiny-2ag-3s': { y_low: 0.48, y_high: 3.02 }
          'small-2ag-3s': { y_low: 0.48, y_high: 3.02 }
        tag: 'test_selected_sight_mean'
        ylabel: 'Test Selected Sight'


    # ======================================================= All Results =======================================================

    #　===================== Original vs DSR (only 2 maps) =====================
    - template_name: 'RWARE_plot_template - base'
      exp_vars:
        alg: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
        map: [ tiny-2ag-5s, tiny-2ag-3s, small-2ag-5s, small-2ag-3s ]
        sight: [ 1s, 2s, 3s, 4s, 5s, "ucb(1,2,3,4,5)_c2_w5000", "ucb(1,2,3)_c2_w5000" ]
      skip_var_combinations:
        - alg: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
          map: [ tiny-1ag-5s,  tiny-2ag-easy-5s, tiny-2ag-5s, small-2ag-5s ]
          sight: [ 'ucb(1,2,3)_c1_w10000', 'ucb(1,2,3)_c2_w5000', 1s, 2s, 3s, 4s ]
        - alg:  [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
          map: [ tiny-1ag-3s,  tiny-2ag-easy-3s, tiny-2ag-3s, small-2ag-3s ]
          sight: [ 'ucb(1,2,3,4,5)_c1_w10000', 'ucb(1,2,3,4,5)_c2_w5000', 4s, 5s, 1s, 2s ]
      plot_config:
        title: '(All Results) RWARE - Original vs UCB'
        list_of_assigned_styles_and_keywords:
          - { keywords: [ 's' ], color: black }
          - { keywords: [ 'ucb' ], color: red }
        y_low: null
        y_high: null
        change_pure_sight_name_to_no_dsr: True
        change_ucb_name_to_dsr: True
        change_ucb_name_to_original: True
