    # Sight
    - template_name: 'RWARE_plot_template - base'
      skip_var_combinations:
        - alg: [ 'iql', 'qmix', 'ippo', 'mappo' ]
          map: [ tiny-1ag-5s,  tiny-2ag-easy-5s, tiny-2ag-5s, small-2ag-5s, tiny-1ag-3s,  tiny-2ag-easy-3s, tiny-2ag-3s, small-2ag-3s]
