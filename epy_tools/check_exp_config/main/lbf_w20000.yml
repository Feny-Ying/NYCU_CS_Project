# --- 給定超參數的範圍 ---
# 假設：整個 domain 一個演算法只會有一組超參數
# `hyperparameter_groups` 是預先給定一些通用的超參數組，group 是超參數組的名稱，例如 value-based、policy-based
# 每個演算法要註明用到哪個參數組(寫在`hyperparameter_group`)，然後各演算法還可以有自己的超參數(`custom_hyperparameters`)
# 若 `custom_hyperparameters` 有和 `hyperparameter_groups` 重複的參數，以 `custom_hyperparameters` 為主(overwrite)
# Dict of keys (group_name) and values (parameter dict: key)
#              parameter_dict: key (parameter_name) and value (list of allowed values，
#                                                                 需要list是因為e.g.,有時 0和null都可以)
# 補充
# - 層級是："all ..." -> "... group" -> "alg custom" 後面 overrite 前面

all_shared_hyperparameters: # 所有 alg 超參的 base (all_shared -> group -> alg custom)
  add_value_last_step: [ True ]
  agent: [ "rnn" ]
  batch_size: [ 32 ]
  reset_buffer_after_switch_visibility: [ False ]
  force_render: [ False ]
  checkpoint_path: [ "" ] # Train from scratch
  env_args:
    - { 'key': 'lbforaging:Foraging-15s-15x15-3p-5f-v1', 'pretrained_wrapper': null, 'time_limit': 50 }
