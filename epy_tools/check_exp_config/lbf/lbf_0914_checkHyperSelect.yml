    "ucb(1,2,3,4,5,6)_c1_w10000": { env_args: { key: [ lbforaging:Foraging-15s-15x15-4p-5f-v1 ] } ,
                                     preprocess_desc: [ "lbf:15s->ucb(1s,2s,3s,4s,5s,6s),c=1,w=10000" ] }
    "ucb(1,2,3,4,5,6)_c1_w20000": { env_args: { key: [ lbforaging:Foraging-15s-15x15-4p-5f-v1 ] } ,
                                        preprocess_desc: [ "lbf:15s->ucb(1s,2s,3s,4s,5s,6s),c=1,w=20000" ] }
    "ucb(1,2,3,4,5,6)_c1.5_w5000": { env_args: { key: [ lbforaging:Foraging-15s-15x15-4p-5f-v1 ] } ,
                                        preprocess_desc: [ "lbf:15s->ucb(1s,2s,3s,4s,5s,6s),c=1.5,w=5000" ] }
    "ucb(1,2,3,4,5,6)_c1.5_w10000": { env_args: { key: [ lbforaging:Foraging-15s-15x15-4p-5f-v1 ] } ,
                                         preprocess_desc: [ "lbf:15s->ucb(1s,2s,3s,4s,5s,6s),c=1.5,w=10000" ] }
    "ucb(1,2,3,4,5,6)_c1.5_w20000": { env_args: { key: [ lbforaging:Foraging-15s-15x15-4p-5f-v1 ] } ,
                                            preprocess_desc: [ "lbf:15s->ucb(1s,2s,3s,4s,5s,6s),c=1.5,w=20000" ] }
    "ucb(1,2,3,4,5,6)_c2_w5000": { env_args: { key: [ lbforaging:Foraging-15s-15x15-4p-5f-v1 ] } ,
                                    preprocess_desc: [ "lbf:15s->ucb(1s,2s,3s,4s,5s,6s),c=2,w=5000" ] }
    "ucb(1,2,3,4,5,6)_c2_w10000": { env_args: { key: [ lbforaging:Foraging-15s-15x15-4p-5f-v1 ] } ,
