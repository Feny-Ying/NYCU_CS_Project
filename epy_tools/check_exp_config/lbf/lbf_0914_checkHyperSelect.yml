parent: epy_tools/check_exp_config/shared/lbf.yml

hp_other_variables:
  sight_id:
    noCurSightId:
      env_args:
        add_sight_id_len: [ null ]
    curSightId:
      env_args:
        add_sight_id_len: [ 6,  7 ]

hp_map_sight:
  6s-4p-5f:
    "ucb(1,2,3,4,5,6)_c1_w5000": { env_args: { key: [ lbforaging:Foraging-15s-15x15-4p-5f-v1 ] } ,
