# --------------- Plotting Settings ---------------
# 畫之前請先跑 `check_exp.py` 確認沒有錯誤再執行 `plot_exp.py`
plot:
  templates:
    - template_name: 'LBF_template - base'
      exp_vars:
        alg: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
        #        map: [ '10s-10x10-4p-2f', '6s-10x10-4p-2f', '10s-10x10-4p-2f-coop', '6s-10x10-4p-2f-coop', '10s-10x10-4p-4f-coop', '6s-10x10-4p-4f-coop', '15s-15x15-3p-5f', '6s-15x15-3p-5f' ]
        map: [ '6s-10x10-4p-2f-coop' ]
        sight: [ 3s, 2s, 4s, 6s, 8s, 9s, 10s, 12s, 15s, "ucb(2,4,6,8,10)_0919", "ucb(2,4,6)_0919" , "ucb(3,6,9,12,15)_0919" ]
      skip_var_combinations: [ ] # Only leave the original one and the ucb one
      plot_config:
        title: 'template'
        save_path: 'lbf/1009_LBF_FORMAL_COMPLETE/'
        tag: 'test_return_mean'
        band: 'std' # 'ci' or 'stderr' or 'minmax'
        plot_skip: 1
        y_low: -0.02
        y_high: 1.02
        ylabel: 'Test Return'
        base_width: 6
        base_height: 6
        no_show: True
        # 標註有哪些 pure sight (也可以不含)。這是用來輔助pure sight 深淺顏色的設定
        pure_sights: [ 2s, 3s, 4s, 6s, 8s, 9s, 10s, 12s, 15s ]
        #
        show_title: False
        show_legend: True
        show_text_on_line: False
        custom_ax_row_var: alg
        custom_ax_col_var: map
        row_var_order: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
        col_var_order: [ '10s-10x10-4p-2f', '6s-10x10-4p-2f', '10s-10x10-4p-2f-coop', '6s-10x10-4p-2f-coop', '10s-10x10-4p-4f-coop', '6s-10x10-4p-4f-coop', '15s-15x15-3p-5f', '6s-15x15-3p-5f' ]
        list_of_assigned_styles_and_keywords:
          - { keywords: [ 'ucb' ], color: red }
        hide_subtitle_description: True
        no_show_row_names: True
        show_subtitle: False
        label_without_len_and_runs: True
        label_without_overall_performance: True

  plots:


    # ====================================================================== For Main Comparison ===========================================================================================================

    # Original sights and UCB
    - template_name: 'LBF_template - base'
      exp_vars:
        alg: [ 'qmix' ]
#        map: [ '10s-10x10-4p-2f', '10s-10x10-4p-2f-coop']
        map: [ '10s-10x10-4p-2f', '6s-10x10-4p-2f']
        sight: [ 3s, 2s, 4s, 6s, 8s, 9s, 10s, 12s, 15s, "ucb(2,4,6,8,10)_0919", "ucb(2,4,6)_0919" , "ucb(3,6,9,12,15)_0919" ]
      skip_var_combinations: # Only leave the original one and the ucb one
        - alg: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
          map: [ '6s-10x10-4p-2f', '6s-10x10-4p-4f', '6s-10x10-4p-2f-coop', '6s-10x10-4p-4f-coop', '6s-15x15-3p-5f' ]
          sight: [ 3s, 2s, 4s, 9s, 12s, 15s, 8s, 10s, "ucb(3,6,9,12,15)_0919", "ucb(2,4,6,8,10)_0919" ]
        - alg: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
          map: [ '10s-10x10-4p-2f', '10s-10x10-4p-4f', '10s-10x10-4p-2f-coop', '10s-10x10-4p-4f-coop' ]
          sight: [ 3s, 2s, 4s, 6s, 8s, 9s, 12s, 15s, "ucb(3,6,9,12,15)_0919", "ucb(2,4,6)_0919" ]
        - alg: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
          map: [ '15s-15x15-3p-5f' ]
          sight: [ 3s, 6s, 9s, 12s, 2s, 4s, 6s, 8s, 10s, "ucb(2,4,6,8,10)_0919", "ucb(2,4,6)_0919" ]
      plot_config:
        title: '(main) LBF - Original vs UCB'
        list_of_assigned_styles_and_keywords:
          - { keywords: [ 's' ], color: black }
          - { keywords: [ 'ucb' ], color: red }
        change_pure_sight_name_to_no_dsr: True
        change_ucb_name_to_dsr: True
        change_ucb_name_to_original: True

    # All pure sights and UCB
    - template_name: 'LBF_template - base'
      exp_vars:
