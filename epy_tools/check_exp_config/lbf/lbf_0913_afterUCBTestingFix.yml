parent: epy_tools/check_exp_config/shared/lbf.yml

# --------------- Plotting Settings ---------------
# 畫之前請先跑 `check_exp.py` 確認沒有錯誤再執行 `plot_exp.py`
plot:
  templates:
    - template_name: 'LBF_template - base'
      exp_vars:
        alg: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
        map: [ 'all-1p-5f', 'all-3p-5f', 'all-4p-5f', 'all-4p-5f-coop', '6s-1p-5f', '6s-3p-5f', '6s-4p-5f', '6s-4p-5f-coop' ]
      skip_var_combinations:
        - alg: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
          map: [ '6s-1p-5f', '6s-3p-5f', '6s-4p-5f', '6s-4p-5f-coop' ]
          sight: [ 15s ]
      plot_config:
        title: 'template'
        save_path: 'lbf/0913/'
        tag: 'test_return_mean'
        band: 'std' # 'ci' or 'stderr' or 'minmax'
        plot_skip: 1
        y_low: -0.02
        y_high: 1.02
        ylabel: 'Test Return'
        base_width: 8
        base_height: 6
        no_show: True
        # 標註有哪些 pure sight (也可以不含)。這是用來輔助pure sight 深淺顏色的設定
        pure_sights: [ 1s, 2s, 3s, 4s, 5s, 6s, 15s ]
        #
        label_without_overall_performance: True
        label_without_len_and_runs: True
        hide_subtitle_description: False
        show_title: False
        show_legend: True
        show_text_on_line: False
        custom_ax_row_var: alg
        custom_ax_col_var: map
        row_var_order: [ 'iql', 'vdn', 'qmix', 'ippo', 'mappo' ]
        col_var_order: [ 'all-1p-5f', 'all-3p-5f', 'all-4p-5f', 'all-4p-5f-coop', '6s-1p-5f', '6s-3p-5f', '6s-4p-5f', '6s-4p-5f-coop' ]
        list_of_assigned_styles_and_keywords:
          - { keywords: [ 'ucb' ], color: red }
          - { keywords: [ 'ucb', 'before0913' ], color: orange }


