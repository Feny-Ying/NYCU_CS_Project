# --------------- Plotting Settings ---------------
# 畫之前請先跑 `check_exp.py` 確認沒有錯誤再執行 `plot_exp.py`
plot:
  candidates:
    - title: 'SMAC w5000 Original 9s Template'
      save_path: 'template_SMAC_w5000_Original9s_WinRate.png'
      tag: battle_won_mean
      maps:
        - 2c_vs_64zg
        - 8m_vs_9m
        - MMM
      algorithms: [ 'iql' ]
      sights: [ 9s, 'ucb(3,5,7,9)_c1_w5000', 'ucb(3,6,9)_c1_w5000' ]
      band: 'std' # 'ci' or 'stderr' or 'minmax'
      plot_skip: 1
      y_low: -0.02
      y_high: 1.02
      base_width: 8
      base_height: 6
      no_show: True
      # 標色
      list_of_assigned_styles_and_keywords:
        - { keywords: [ 'ucb' ], color: 'red' }
      # 標註有哪些 pure sight (也可以不含)。這是用來輔助pure sight 深淺顏色的設定
      pure_sights: [ 3s, 6s, 9s, 12s, 15s, 18s, 21s ]
      #
      label_without_overall_performance: False
      hide_title_description: True
      show_title: False
      show_legend: True
      show_text_on_line: True


  run: [ ]
  #  run:
  #    - 'rware_original5s_testReturnMean.png'
  #    - 'rware_original3s_testReturnMean.png'

  function_run:
    # Win Rate
