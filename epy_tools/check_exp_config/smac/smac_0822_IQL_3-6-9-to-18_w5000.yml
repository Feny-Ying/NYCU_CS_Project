hyperparameter_groups:
  value-based:
    action_selector: [ "epsilon_greedy" ]
    epsilon_start: [ 1.0 ]
    epsilon_finish: [ 0.05 ]
    epsilon_anneal_time: [ 50000 ]
    evaluation_epsilon: [ 0.05 ]
    runner: [ "episode" ]
    buffer_size: [ 5000 ]
    target_update_interval_or_tau: [ 200 ]
    obs_agent_id: [ True ]
    obs_last_action: [ False ]
    obs_individual_obs: [ False ]
    agent_output_type: [ "q" ]
    learner: [ "q_learner" ]
    standardise_returns: [ False ]
    standardise_rewards: [ True ]
    double_q: [ True ]
    use_rnn: [ True ]
    lr: [ 0.0005 ]
    hidden_dim: [ 128 ]
    batch_size_run: [ 1 ]
    test_interval: [ 50000 ]





