      save_path: 'try/0822_train_IQL_3-6-9-to-18_w5000/win_rate/SMAC_w5000_Original12s_WinRate.png'
      sights: [ 3s, 6s, 9s, 12s, 'ucb(3,6,9,12)_c1_w5000' ]
    - template_save_path: 'template_SMAC_w5000_Original9s_WinRate.png'
