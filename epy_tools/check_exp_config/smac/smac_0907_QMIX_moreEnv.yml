parent: epy_tools/check_exp_config/shared/smac.yml

hp_all:
  dormant_check_interval: [ 0 ]
  policy_diff_interval_1: [ 0 ]
  policy_diff_interval_2: [ 0 ]
  policy_diff_interval_3: [ 0 ]


hp_other_variables:
  state:
    concatenatedObsAsState:
      env_args:
        concatenate_obs_as_state: [ True ]
    originalState:
      env_args:
        concatenate_obs_as_state: [ False ]
  rs:
    rs1:
      env_args:
        reward_scale_rate: [ 1 ]
    rs20:
      env_args:
        reward_scale_rate: [ 20 ]
  sight_info:
    noCurSightInfo:
      env_args:
        no_cur_sight_info: [ True ]
    curSightInfo:
      env_args:
        no_cur_sight_info: [ False ]

# --------------- Plotting Settings ---------------
# 畫之前請先跑 `check_exp.py` 確認沒有錯誤再執行 `plot_exp.py`
plot:
  templates:
    - template_name: 'SMAC_plot_template - sight + div20'
      exp_vars:
        alg: [ 'qmix' ]
        map: [ '25m', 'so_many_baneling' ]
        sight: [ ]
        state: [ concatenatedObsAsState, originalState ]
        rs: [ rs20 ]
        sight_info: [ curSightInfo, noCurSightInfo ]
      skip_var_combinations:
        - alg: [ 'qmix' ]
          map: [ '25m', 'so_many_baneling' ]
          sight: [ 6s, 7s, 8s, 9s, 12s, 15s, 18s ]
          state: [ concatenatedObsAsState, originalState ]
          rs: [ rs1, rs20 ]
          sight_info: [ curSightInfo ]
        - alg: [ 'qmix' ]
          map: [ '25m', 'so_many_baneling' ]
          sight: [ 'ucb(6,7,8,9)_c1_w20000', 'ucb(6,9)_c1_w20000', 'ucb(6,9,12)_c1_w20000', 'ucb(6,9,12,15)_c1_w20000', 'ucb(6,9,12,15,18)_c1_w20000', 'ucb(6,9)_c1_w20000_div20' ]
          state: [ concatenatedObsAsState, originalState ]
          rs: [ rs1, rs20 ]
          sight_info: [ noCurSightInfo ]
        # Prevent: div20 and rs1 at the same time
        - sight:
            - 'ucb(3,6,9)_c1_w20000_div20'
            - 'ucb(6,7,8,9)_c1_w20000_div20'
            - 'ucb(6,9)_c1_w20000_div20'
            - 'ucb(6,9,12)_c1_w20000_div20'
            - 'ucb(6,9,12,15)_c1_w20000_div20'
            - 'ucb(6,9,12,15,18)_c1_w20000_div20'
          state: [ concatenatedObsAsState, originalState ]
          map: [ 8m_vs_9m ]
          alg: [ qmix ]
          sight_info: [ curSightInfo, noCurSightInfo ]
          rs: [ rs1 ]
      plot_config:
        title: 'SMAC - Whether to add current sight info?'
        save_path: 'try/0907_QMIX/hyperparameters/sights/'
        tag: battle_won_mean
        band: 'std' # 'ci' or 'stderr' or 'minmax'
        plot_skip: 1
        y_low: -0.02
        y_high: 1.02
        ylabel: 'Win Rate'
        base_width: 8
        base_height: 6
        no_show: True
        # 標註有哪些 pure sight (也可以不含)。這是用來輔助pure sight 深淺顏色的設定
        pure_sights: [ 6s, 9s, 12s, 15s, 18s, 21s ]
        #
        label_without_overall_performance: True
        label_without_len_and_runs: False
        hide_subtitle_description: False
        show_title: False
        show_legend: True
        show_text_on_line: False
        custom_ax_row_var: state
        custom_ax_col_var: map
        row_var_order: [ originalState, concatenatedObsAsState ]
        col_var_order: [ 25m, so_many_baneling ]
        list_of_assigned_styles_and_keywords:
          - { keywords: [ 'ucb' ], color: red }
          - { keywords: [ 'ucb', 'div20' ], color: 'mediumseagreen' }
          - { keywords: [ 'ucb', 'noCurSightInfo' ], linestyle: 'dotted' }

