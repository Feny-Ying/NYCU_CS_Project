domain: SMAC
parent: null
seeds: [ 0, 1, 2, 3, 4 ]

hp_all_skip: # 所有 alg 都跳過檢查的超參數。為 list of str。
  - t_max
  - save_path
  - buffer_cpu_only
  - seed # 這裡不用設，因為別處有特別檢查 seed
  - local_results_path
  - name
  - reset_pos
  - save_model
  - save_model_interval
  - save_replay
  - use_cuda
  - use_tensorboard
  - render
  - force_render


hp_all:
  add_value_last_step: [ True ]
  agent: [ "rnn" ]
  batch_size: [ 32 ]
  reset_buffer_after_switch_visibility: [ False ]
  force_render: [ False ]
  checkpoint_path: [ "" ] # Train from scratch
  env_args: # 3 map x 2 addInfo x 2 (w/ w/o concatenate_obs_as_state)
    # noinspection YAMLIncompatibleTypes
    add_sight_id_len: [ null, 3, 4, 5, 6, 7 ]
    concatenate_obs_as_state: [ False, True ]
    continuing_episode: [ False ]
    debug: [ False ]
    difficulty: [ '7' ]
    game_version: [ null ]
    heuristic_ai: [ False ]
    heuristic_rest: [ False ]
    map_name: [ 'MMM', '2c_vs_64zg', '8m_vs_9m' ]
    move_amount: [ 2 ]
    no_cur_sight_info: [ False, True ]
    obs_all_health: [ True ]
    obs_instead_of_state: [ False ]
    obs_last_action: [ False ]
    obs_own_health: [ True ]
    obs_pathing_grid: [ False ]
    obs_terrain_height: [ False ]
    obs_timestep_number: [ False ]
    replay_dir: [ '' ]
    replay_prefix: [ '' ]
    reward_death_value: [ 10 ]
    reward_defeat: [ 0 ]
    reward_negative_scale: [ 0.5 ]
    reward_only_positive: [ True ]
    reward_scale: [ True ]
    reward_scale_rate: [ 20 ]
    reward_sparse: [ False ]
    reward_win: [ 200 ]
    seed: [ null ]
    shoot_range: [ null ]
    state_last_action: [ False ]
    state_timestep_number: [ False ]
    step_mul: [ 8 ]
  evaluate: [ False ]
  gamma: [ 0.99 ]
  grad_norm_clip: [ 10.0 ]
  env: [ 'asc2' ]
  hypergroup: [ null ]
  label: [ 'default_label' ]
  runner_log_interval: [ 10000 ]
  learner_log_interval: [ 10000 ]
  load_step: [ 0 ]
  log_interval: [ 50000 ]
  mac: [ 'basic_mac' ]
  n_distillation_grad_steps: [ 0 ]
  n_grad_steps: [ 1 ]
  n_offline_grad_steps: [ 0 ]
  optim_alpha: [ 0.99 ]
  optim_eps: [ !!float 1e-05 ]
  preprocess_desc: [ null ]
  redo_freq: [ 0 ]
  redo_tau: [ 0 ]
  repeat_id: [ 1 ]
  reset_freq: [ 0 ]
  test_greedy: [ True ]
  test_nepisode: [ 100 ]
  train_next_visibility: [ False ]
  turn_off_train_preprocess: [ False ]
  weight_decay: [ 0.0 ]
  reset_after_switch_visibility: [ False ]
  dormant_all_taus: [ [ 0, 0.0001, 0.001, 0.01 ] ]
  policy_diff_n_batches: [ 32 ]
  dormant_n_batches: [ 32 ]
  offline_buffer_path: [ null ]
  offline_buffer_grad_steps: [ 100 ]
  dormant_check_interval: [ 0 ]
  policy_diff_interval_1: [ 0 ]
  policy_diff_interval_2: [ 0 ]
  policy_diff_interval_3: [ 0 ]

hp_alg_group:
  value-based:
    action_selector: [ "epsilon_greedy" ]
    epsilon_start: [ 1.0 ]
    epsilon_finish: [ 0.05 ]
    epsilon_anneal_time: [ 50000 ]
    evaluation_epsilon: [ 0.05 ]
    runner: [ "episode" ]
    buffer_size: [ 5000 ]
    target_update_interval_or_tau: [ 200 ]
    obs_agent_id: [ True ]
    obs_last_action: [ False ]
    obs_individual_obs: [ False ]
    agent_output_type: [ "q" ]
    learner: [ "q_learner" ]
    standardise_returns: [ False ]
    standardise_rewards: [ True ]
    double_q: [ True ]
    use_rnn: [ True ]
    lr: [ 0.0005 ]
    hidden_dim: [ 128 ]
    batch_size_run: [ 1 ]
    test_interval: [ 100000 ]

hp_alg:
  qmix:
    min_n_tests: 41  # 4M: 10w * (40 + 1) = 4M
    hyperparameter_group: value-based
    not_having_ok_hyperparameters:
      - force_render
      - train_next_visibility # 預設是不使用，所以沒有specify也不影響
      - reset_buffer_after_switch_visibility # 預設是不使用，所以沒有specify也不影響
    custom_hyperparameters:
      mixer: [ qmix ]
      mixing_embed_dim: [ 32 ]
      hypernet_layers: [ 2 ]
      hypernet_embed: [ 64 ]
  fas_qmix_dyn_lambda6:
    min_n_tests: 41  # 4M: 10w * (40 + 1) = 4M
    hyperparameter_group: value-based
    not_having_ok_hyperparameters:
      - force_render
      - train_next_visibility # 預設是不使用，所以沒有specify也不影響
      - reset_buffer_after_switch_visibility # 預設是不使用，所以沒有specify也不影響
    custom_hyperparameters:
      mixer: [ qmix ]
      mixing_embed_dim: [ 32 ]
      hypernet_layers: [ 2 ]
      hypernet_embed: [ 64 ]
      use_fas: [ True ]
      fas_lambda: [ 6 ]
      fas_dynamic: [ True ]
  fas_qmix_dyn_lambda8:
    min_n_tests: 41  # 4M: 10w * (40 + 1) = 4M
    hyperparameter_group: value-based
    not_having_ok_hyperparameters:
      - force_render
      - train_next_visibility # 預設是不使用，所以沒有specify也不影響
      - reset_buffer_after_switch_visibility # 預設是不使用，所以沒有specify也不影響
    custom_hyperparameters:
      mixer: [ qmix ]
      mixing_embed_dim: [ 32 ]
      hypernet_layers: [ 2 ]
      hypernet_embed: [ 64 ]
      use_fas: [ True ]
      fas_lambda: [ 8 ]
      fas_dynamic: [ True ]
  fas_qmix_lambda6:
    min_n_tests: 41  # 4M: 10w * (40 + 1) = 4M
    hyperparameter_group: value-based
    not_having_ok_hyperparameters:
      - force_render
      - train_next_visibility # 預設是不使用，所以沒有specify也不影響
      - reset_buffer_after_switch_visibility # 預設是不使用，所以沒有specify也不影響
    custom_hyperparameters:
      mixer: [ qmix ]
      mixing_embed_dim: [ 32 ]
      hypernet_layers: [ 2 ]
      hypernet_embed: [ 64 ]
      use_fas: [ True ]
      fas_lambda: [ 6 ]
      fas_dynamic: [ False ]


hp_map:
  2c_vs_64zg:
    env_args:
      map_name: [ 2c_vs_64zg ]
  8m_vs_9m:
    env_args:
      map_name: [ 8m_vs_9m ]
  25m:
    env_args:
      map_name: [ 25m ]
  MMM:
    env_args:
      map_name: [ MMM ]
  so_many_baneling:
    env_args:
      map_name: [ so_many_baneling ]

hp_sight:
  3s:
    preprocess_desc: [ "asc2:3s->ucb(3s),c=2,w=5000" ]
    env_args: { no_cur_sight_info: [ True ], add_sight_one_hot: [ False ], default_sight_range: [ 3 ] }
  6s:
    preprocess_desc: [ "asc2:6s->ucb(6s),c=2,w=5000" ]
    env_args: { no_cur_sight_info: [ True ], add_sight_one_hot: [ False ], default_sight_range: [ 6 ] }
  9s:
    preprocess_desc: [ "asc2:9s->ucb(9s),c=2,w=5000" ]
    env_args: { no_cur_sight_info: [ True ], add_sight_one_hot: [ False ], default_sight_range: [ 9 ] }
  12s:
    preprocess_desc: [ "asc2:12s->ucb(12s),c=2,w=5000" ]
    env_args: { no_cur_sight_info: [ True ], add_sight_one_hot: [ False ], default_sight_range: [ 12 ] }
  15s:
    preprocess_desc: [ "asc2:15s->ucb(15s),c=2,w=5000" ]
    env_args: { no_cur_sight_info: [ True ], add_sight_one_hot: [ False ], default_sight_range: [ 15 ] }
  18s:
    preprocess_desc: [ "asc2:18s->ucb(18s),c=2,w=5000" ]
    env_args: { no_cur_sight_info: [ True ], add_sight_one_hot: [ False ] , default_sight_range: [ 18 ] }
  21s:
    preprocess_desc: [ "asc2:21s->ucb(21s),c=2,w=5000" ]
    env_args: { no_cur_sight_info: [ True ], add_sight_one_hot: [ False ] , default_sight_range: [ 21 ] }
  "ucb(3,6,9)_c2_w5000_div20":
    preprocess_desc: [ "asc2:9s->ucb(3s,6s,9s),c=2,w=5000,div=20" ]
    env_args: { no_cur_sight_info: [ True ], add_sight_one_hot: [ True ], default_sight_range: [ 9 ] }
  "ucb(3,6,9,12)_c2_w5000_div20":
    preprocess_desc: [ "asc2:12s->ucb(3s,6s,9s,12s),c=2,w=5000,div=20" ]
    env_args: { no_cur_sight_info: [ True ], add_sight_one_hot: [ True ], default_sight_range: [ 12 ] }
  "ucb(3,6,9,12,15)_c2_w5000_div20":
    preprocess_desc: [ "asc2:15s->ucb(3s,6s,9s,12s,15s),c=2,w=5000,div=20" ]
    env_args: { no_cur_sight_info: [ True ], add_sight_one_hot: [ True ], default_sight_range: [ 15 ] }
  "ucb(3,6,9,12,15,18)_c2_w5000_div20":
    preprocess_desc: [ "asc2:18s->ucb(3s,6s,9s,12s,15s,18s),c=2,w=5000,div=20" ]
    env_args: { no_cur_sight_info: [ True ], add_sight_one_hot: [ True ] , default_sight_range: [ 18 ] }
  "ucb(3,6,9,12,15,18,21)_c2_w5000_div20":
    preprocess_desc: [ "asc2:21s->ucb(3s,6s,9s,12s,15s,18s,21s),c=2,w=5000,div=20" ]
    env_args: { no_cur_sight_info: [ True ], add_sight_one_hot: [ True ], default_sight_range: [ 21 ] }

hp_other_variables:
  state:
    concatObsAsState:
      env_args:
        obs_instead_of_state: [ True ]
    originalState:
      env_args:
        obs_instead_of_state: [ False ]
  mask_where:
    MaskBoth:
      env_args:
        dsr_not_influence_concat_state: [ False ]
        dsr_not_influence_obs: [ False ]
    MaskState:
      env_args:
        dsr_not_influence_concat_state: [ False ]
        dsr_not_influence_obs: [ True ]
    MaskObs:
      env_args:
        dsr_not_influence_concat_state: [ True ]
        dsr_not_influence_obs: [ False ]
    MaskNone:
      env_args:
        dsr_not_influence_concat_state: [ True ]
        dsr_not_influence_obs: [ True ]

# --------------- Plotting Settings ---------------
# 畫之前請先跑 `check_exp.py` 確認沒有錯誤再執行 `plot_exp.py`
plot:
  templates:
    - template_name: 'SMAC_plot_template'
      exp_vars:
        alg: [ 'qmix' ]
        map: [ '8m_vs_9m' ]
        sight: [ 3s, 6s, 9s, 12s, 15s, 18s, 21s, "ucb(3,6,9)_c2_w5000_div20", "ucb(3,6,9,12)_c2_w5000_div20", "ucb(3,6,9,12,15)_c2_w5000_div20", "ucb(3,6,9,12,15,18)_c2_w5000_div20", "ucb(3,6,9,12,15,18,21)_c2_w5000_div20" ]
        state: [ concatObsAsState, originalState ]
        mask_where: [ MaskBoth, MaskState, MaskObs, MaskNone ]
      skip_var_combinations:
        # Pure sight can only have: `MaskNone`
        - alg: [ 'qmix' ]
          map: [ '8m_vs_9m' ]
          sight: [ 3s, 6s, 9s, 12s, 15s, 18s, 21s ]
          state: [ concatObsAsState, originalState ]
          mask_where: [ MaskBoth, MaskState, MaskObs ]
        # No way: originalState + (MaskState or MaskBoth)
        - alg: [ 'qmix' ]
          map: [ '8m_vs_9m' ]
          sight: [ 3s, 6s, 9s, 12s, 15s, 18s, 21s, "ucb(3,6,9)_c2_w5000_div20", "ucb(3,6,9,12)_c2_w5000_div20", "ucb(3,6,9,12,15)_c2_w5000_div20", "ucb(3,6,9,12,15,18)_c2_w5000_div20", "ucb(3,6,9,12,15,18,21)_c2_w5000_div20" ]
          state: [ originalState ]
          mask_where: [ MaskState, MaskBoth ]
        # UCB cannot have: MaskNone
        - alg: [ 'qmix' ]
          map: [ '8m_vs_9m' ]
          sight: [ "ucb(3,6,9)_c2_w5000_div20", "ucb(3,6,9,12)_c2_w5000_div20", "ucb(3,6,9,12,15)_c2_w5000_div20", "ucb(3,6,9,12,15,18)_c2_w5000_div20", "ucb(3,6,9,12,15,18,21)_c2_w5000_div20" ]
          state: [ concatObsAsState, originalState ]
          mask_where: [ MaskNone ]
      plot_config:
        title: 'SMAC - template'
        save_path: 'try/1005_QMIX/template.png'
        tag: test_battle_won_mean
        band: 'std' # 'ci' or 'stderr' or 'minmax'
        plot_skip: 1
        y_low: -0.02
        y_high: 1.02
        ylabel: 'Win Rate'
        base_width: 6
        base_height: 8
        no_show: True
        # 標註有哪些 pure sight (也可以不含)。這是用來輔助pure sight 深淺顏色的設定
        pure_sights: [ 3s, 6s, 9s, 12s, 15s, 18s, 21s ]
        #
        label_without_overall_performance: True
        label_without_len_and_runs: False
        hide_subtitle_description: False
        show_title: False
        show_legend: True
        show_text_on_line: False
        custom_ax_row_var: alg
        custom_ax_col_var: state
        row_var_order: [ qmix ]
        col_var_order: [ originalState,  concatObsAsState ]
        list_of_assigned_styles_and_keywords:
          - { keywords: [ 'ucb', 'MaskObs' ], color: 'orange' }
          - { keywords: [ 'ucb', 'MaskState' ], color: 'green' }
          - { keywords: [ 'ucb', 'MaskBoth' ], color: 'red' }

  plots:
    # ================= Pure vs DSR (all state) =================
    #    - template_name: 'SMAC_plot_template'
    #      exp_vars:
    #        alg: [ 'qmix' ]
    #        map: [ '8m_vs_9m' ]
    #        sight: [ 3s, 6s, 9s, 12s, 15s, 18s, 21s, "ucb(3,6,9,12,15,18,21)_c2_w5000_div20" ]
    #        state: [ concatObsAsState, originalState ]
    #        mask_where: [ MaskBoth, MaskState, MaskObs, MaskNone ]
    #      plot_config: { save_path: 'try/1005_QMIX/', title: 'SMAC - Sight range = 21' }
    #    - template_name: 'SMAC_plot_template'
    #      exp_vars:
    #        alg: [ 'qmix' ]
    #        map: [ '8m_vs_9m' ]
    #        sight: [ 3s, 6s, 9s, 12s, 15s, "ucb(3,6,9,12,15)_c2_w5000_div20" ]
    #        state: [ concatObsAsState, originalState ]
    #        mask_where: [ MaskBoth, MaskState, MaskObs, MaskNone ]
    #      plot_config: { save_path: 'try/1005_QMIX/', title: 'SMAC - Sight range = 15' }
    #    - template_name: 'SMAC_plot_template'
    #      exp_vars:
    #        alg: [ 'qmix' ]
    #        map: [ '8m_vs_9m' ]
    #        sight: [ 3s, 6s, 9s, "ucb(3,6,9)_c2_w5000_div20" ]
    #        state: [ concatObsAsState, originalState ]
    #        mask_where: [ MaskBoth, MaskState, MaskObs, MaskNone ]
    #      plot_config: { save_path: 'try/1005_QMIX/', title: 'SMAC - Sight range = 9' }

    # ================= DSR vs UCB vs Original (ConcatObsAsState) =================
    - template_name: 'SMAC_plot_template'
      exp_vars:
        alg: [ 'qmix', 'fas_qmix_dyn_lambda8', 'fas_qmix_dyn_lambda6', 'fas_qmix_lambda6' ]
        map: [ '8m_vs_9m' ]
        sight: [ 21s, "ucb(3,6,9,12,15,18,21)_c2_w5000_div20" ]
        state: [ concatObsAsState, originalState ]
        mask_where: [ MaskBoth, MaskState, MaskObs, MaskNone ]
      skip_var_combinations:
        # For FAS, its mask setting must be "MaskNone"
        - alg: [ 'fas_qmix_dyn_lambda8', 'fas_qmix_dyn_lambda6', 'fas_qmix_lambda6' ]
          map: [ '8m_vs_9m' ]
          sight: [ 3s, 6s, 9s, 12s, 15s, 18s, 21s ]
          state: [ concatObsAsState, originalState ]
          mask_where: [ MaskBoth, MaskState, MaskObs ]
        # For FAS, its state setting must be "concatObsAsState"
        - alg: [ 'fas_qmix_dyn_lambda8', 'fas_qmix_dyn_lambda6', 'fas_qmix_lambda6' ]
          map: [ '8m_vs_9m' ]
          sight: [ 3s, 6s, 9s, 12s, 15s, 18s, 21s ]
          state: [ originalState ]
          mask_where: [ MaskNone, MaskBoth, MaskState, MaskObs ]
        # For FAS, it cannot have sights like "ucb"
        - alg: [ 'fas_qmix_dyn_lambda8', 'fas_qmix_dyn_lambda6', 'fas_qmix_lambda6' ]
          map: [ '8m_vs_9m' ]
          sight: [ "ucb(3,6,9)_c2_w5000_div20", "ucb(3,6,9,12)_c2_w5000_div20", "ucb(3,6,9,12,15)_c2_w5000_div20", "ucb(3,6,9,12,15,18)_c2_w5000_div20", "ucb(3,6,9,12,15,18,21)_c2_w5000_div20" ]
          state: [ concatObsAsState, originalState ]
          mask_where: [ MaskNone, MaskBoth, MaskState, MaskObs ]
        # Not to show original state datas
        - alg: [ 'qmix', 'fas_qmix_dyn_lambda8', 'fas_qmix_dyn_lambda6', 'fas_qmix_lambda6' ]
          map: [ '8m_vs_9m' ]
          sight: [ 3s, 6s, 9s, 12s, 15s, 18s, 21s, "ucb(3,6,9)_c2_w5000_div20", "ucb(3,6,9,12)_c2_w5000_div20", "ucb(3,6,9,12,15)_c2_w5000_div20", "ucb(3,6,9,12,15,18)_c2_w5000_div20", "ucb(3,6,9,12,15,18,21)_c2_w5000_div20" ]
          state: [ originalState ]
          mask_where: [ MaskBoth, MaskState, MaskObs, MaskNone ]
      plot_config:
        save_path: 'try/1005_QMIX/'
        title: 'SMAC - ConcatObsAsState: DSR vs FAS (21s)'
        custom_ax_row_var: state

        list_of_assigned_styles_and_keywords:
          - { keywords: [ 'ucb', 'MaskObs' ], color: 'orange' }
          - { keywords: [ 'ucb', 'MaskState' ], color: 'yellow' }
          - { keywords: [ 'ucb', 'MaskBoth' ], color: 'red' }
          - { keywords: [ 'fas_qmix_dyn_lambda8' ], color: 'green' }
          - { keywords: [ 'fas_qmix_dyn_lambda6' ], color: 'springgreen' }
          - { keywords: [ 'fas_qmix_lambda6' ], color: 'darkolivegreen' }
        n_tag_data: 21

